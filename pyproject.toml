[project]
name = "bookdb"
version = "0.1.0"
description = "本地优先的个人图书元数据数据库工具（CLI + 可选桌面 WebView）"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
book = "bookdb.main:main"

#: GUI 独立入口 —— `BookDB.exe` 的入口（P0 产品化：普通用户无需经过 CLI）
[project.gui-scripts]
BookDB = "bookdb.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
