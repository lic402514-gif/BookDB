[project]
name = "bookdb"
version = "0.2.1"
description = "本地优先的个人图书元数据管理工具（SQLite + Typer CLI + pywebview 桌面 GUI）"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["books", "library", "metadata", "sqlite", "cli", "desktop", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/lic402514-gif/BookDB"
Repository = "https://github.com/lic402514-gif/BookDB"
Issues = "https://github.com/lic402514-gif/BookDB/issues"

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]      # 打包 BookDB.exe（P0 产品化）
trash = ["send2trash>=1.8"]       # 批量删除文件 → 送回收站（不永久删除）

[project.scripts]
book = "bookdb.main:main"

#: GUI 独立入口 —— `BookDB.exe` 的入口（P0 产品化：普通用户无需经过 CLI）
[project.gui-scripts]
BookDB = "bookdb.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
