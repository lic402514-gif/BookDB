<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bookdb — 图书元数据</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">📚 <span>bookdb</span></div>

  <div class="search">
    <input id="q" type="search" placeholder="搜索：书名 / 作者 / 译者 / 出版社 / ISBN / CLC / 摘要（回车）" autocomplete="off">
    <button id="btn-adv" class="ghost" title="高级筛选">⚙</button>
  </div>

  <div class="actions">
    <button id="btn-new"    class="primary">＋ 添加</button>
    <button id="btn-scan"   class="ghost" title="扫描目录，按文件名批量建记录">📂 扫描建库</button>
    <button id="btn-import" class="ghost">📥 导入</button>
    <button id="btn-export" class="ghost">📤 导出</button>
    <button id="btn-enrich" class="ghost">🔍 版权页提取</button>
    <button id="btn-enrich-all" class="ghost" title="批量补全：逐条跑 VLM 补齐作者/出版社/年份/ISBN">✨ 批量补全</button>
    <button id="btn-ai" class="ghost" title="本地 AI 模型：下载 / 选择 / 删除">🧠 AI 模型</button>
  </div>
</header>

<div id="filters" class="filters hidden">
  <label>作者<input id="f-author" type="text"></label>
  <label>年份<input id="f-year" type="text" placeholder="2019 | 1800-1900 | 1800-"></label>
  <label>CLC<input id="f-clc" type="text" placeholder="前缀"></label>
  <label>出版社<input id="f-publisher" type="text"></label>
  <label>类型<input id="f-type" type="text" placeholder="M"></label>
  <label class="check"><input id="f-hasfile" type="checkbox"> 仅有文件</label>
  <button id="btn-clear" class="ghost">清除</button>
</div>

<main>
  <section class="list-pane">
    <div class="pane-head">
      <span id="list-count" class="muted">—</span>
      <span id="lib-root" class="muted"></span>
    </div>

    <!-- 批量操作条（有选择时才出现） -->
    <div id="batch-bar" class="batch-bar hidden">
      <span id="batch-count" class="muted"></span>
      <button id="btn-b-rename"  class="ghost" title="按元数据规范化文件名">✎ 批量重命名</button>
      <button id="btn-b-move"    class="ghost" title="把选中的文件移动到指定目录">📦 批量移动</button>
      <button id="btn-b-delmeta" class="ghost" title="只删除数据库记录，文件保留">🗑 删除元数据</button>
      <button id="btn-b-delfile" class="danger" title="删除文件本体（送回收站）">💥 连文件删除</button>
      <button id="btn-b-clear"   class="ghost">✕ 取消选择</button>
    </div>

    <div class="table-wrap">
      <table id="book-table">
        <thead>
          <tr>
            <th class="sel"><input id="sel-all" type="checkbox" title="全选 / 全不选（当前列表）"></th>
            <th>ID</th><th>书名</th><th>作者</th><th>出版社</th><th>年份</th><th>CLC</th>
          </tr>
        </thead>
        <tbody id="book-rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">暂无记录</div>
    </div>
  </section>

  <section class="detail-pane">
    <div id="detail-empty" class="empty tall">← 从左侧选择一本书，或点击「＋ 添加」新建</div>
    <form id="detail-form" class="hidden" autocomplete="off">
      <div class="detail-head">
        <h2 id="detail-title">新建图书</h2>
        <span id="detail-id" class="muted"></span>
      </div>

      <div class="grid">
        <label class="col2">书名 *<input name="title" required></label>
        <label>作者<input name="author"></label>
        <label>译者<input name="translator"></label>
        <label>出版社<input name="publisher"></label>
        <label>出版地<input name="publication_place"></label>
        <label>出版年份<input name="publication_year"></label>
        <label>版次<input name="edition" placeholder="纯数字，如 2"></label>
        <label>ISBN<input name="isbn"></label>
        <label>CLC<input name="clc_code"></label>
        <label>文献类型<input name="literature_type" placeholder="默认 M"></label>
        <label class="col2">文件路径<input name="file_path"></label>
        <label class="col2">摘要<textarea name="abstract" rows="4"></textarea></label>
      </div>

      <div class="detail-actions">
        <button type="submit" class="primary">💾 保存</button>
        <button type="button" id="btn-cite"   class="ghost">❝ 引用</button>
        <button type="button" id="btn-rename" class="ghost">✎ 重命名</button>
        <button type="button" id="btn-open"   class="ghost" title="用系统默认程序打开该文件">📖 打开文件</button>
        <button type="button" id="btn-reveal" class="ghost" title="在文件管理器中定位该文件">📂 所在文件夹</button>
        <button type="button" id="btn-delete" class="danger">🗑 删除</button>
      </div>
      <div id="detail-meta" class="muted small"></div>
    </form>
  </section>
</main>

<div id="notice" class="notice hidden"></div>

<!-- 欢迎页（P0：尚未打开任何 Library 时全屏覆盖） -->
<div id="welcome" class="welcome hidden">
  <div class="welcome-card">
    <h1>📚 欢迎使用 BookDB</h1>
    <p id="welcome-sub" class="muted">还没有打开书库。</p>

    <div id="welcome-recent" class="welcome-recent hidden">
      <h2>最近使用</h2>
      <ul id="welcome-list"></ul>
    </div>

    <div class="welcome-actions">
      <button id="welcome-new" class="primary">新建 Library</button>
      <button id="welcome-open" class="ghost">打开已有 Library…</button>
    </div>

    <p class="muted small">BookDB 会记住你上次打开的书库，下次启动自动打开。</p>
  </div>
</div>

<!-- 通用弹层 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button id="modal-close" class="ghost">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
